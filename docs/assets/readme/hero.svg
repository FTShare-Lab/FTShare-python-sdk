<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="390" viewBox="0 0 1200 390" role="img" aria-labelledby="title desc">
  <title id="title">FTShare Python SDK</title>
  <desc id="desc">FTShare Python SDK 正式版首页视觉，展示通过 Python 调用 FTShare A股新闻情绪因子并返回 pandas DataFrame。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F9FBFF"/>
      <stop offset="0.6" stop-color="#F3F7FF"/>
      <stop offset="1" stop-color="#EAF3FF"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3157E8"/>
      <stop offset="1" stop-color="#58A6FF"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#234AA5" flood-opacity="0.10"/>
    </filter>
  </defs>

  <rect width="1200" height="390" rx="28" fill="url(#bg)"/>
  <path d="M0 312 C210 262 360 365 560 314 C770 260 920 286 1200 222 L1200 390 L0 390 Z" fill="#FFFFFF" opacity="0.58"/>

  <g id="title-block" transform="translate(64 54)">
    <rect x="0" y="0" width="186" height="34" rx="17" fill="#E7EEFF"/>
    <circle cx="20" cy="17" r="5" fill="#3563E9"/>
    <text x="34" y="23" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16" font-weight="700" fill="#3157E8">FTSHARE · v1.0.1</text>

    <text x="0" y="94" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, sans-serif" font-size="55" font-weight="760" fill="#111827">FTShare Python SDK</text>
    <text x="0" y="140" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, sans-serif" font-size="27" font-weight="600" fill="#263244">用 Python 和 pandas 接入金融数据</text>
    <text x="0" y="182" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, sans-serif" font-size="20" fill="#667085">基础金融数据与 FTShare 特色因子统一接入</text>

    <g transform="translate(0 222)">
      <rect width="178" height="48" rx="12" fill="#E7EEFF"/>
      <text x="89" y="31" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, sans-serif" font-size="18" font-weight="650" fill="#3157E8">DataFrame-first</text>
      <rect x="194" width="178" height="48" rx="12" fill="#FFFFFF" stroke="#D8E0EE"/>
      <text x="283" y="31" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, sans-serif" font-size="18" font-weight="650" fill="#111827">API Key 鉴权</text>
    </g>
  </g>

  <g id="project-proof" transform="translate(666 48)" filter="url(#shadow)">
    <rect width="470" height="294" rx="22" fill="#111722"/>
    <circle cx="24" cy="24" r="5" fill="#FF6B6B"/>
    <circle cx="42" cy="24" r="5" fill="#FFD166"/>
    <circle cx="60" cy="24" r="5" fill="#56D37C"/>
    <text x="82" y="29" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16" fill="#8D9AAF">python</text>

    <text x="24" y="72" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="17" fill="#8FB8FF">import</text>
    <text x="90" y="72" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="17" fill="#E5ECF8">ftshare</text>
    <text x="162" y="72" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="17" fill="#8FB8FF">as</text>
    <text x="189" y="72" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="17" fill="#E5ECF8">ft</text>

    <text x="24" y="102" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="17" fill="#E5ECF8">market = ft.market_api()</text>
    <text x="24" y="136" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16" fill="#E5ECF8">df = market.<tspan fill="#64D6B3">ashare_news_sentiment_factors</tspan>(</text>
    <text x="42" y="164" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16" fill="#E5ECF8">trade_code="600519.SH",</text>
    <text x="42" y="190" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16" fill="#E5ECF8">limit=5,</text>
    <text x="24" y="214" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16" fill="#E5ECF8">)</text>

    <path d="M236 216 L236 228" stroke="url(#blue)" stroke-width="3" stroke-linecap="round"/>
    <path d="M228 221 L236 230 L244 221" fill="none" stroke="#58A6FF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

    <g transform="translate(24 240)">
      <rect width="422" height="42" rx="10" fill="#F7F9FC"/>
      <rect x="1" y="1" width="99" height="40" rx="9" fill="#E7EEFF"/>
      <path d="M100 1 V41 M206 1 V41 M312 1 V41" stroke="#D6DEEB"/>
      <text x="50" y="27" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" font-weight="700" fill="#3157E8">股票代码</text>
      <text x="153" y="27" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" fill="#344054">日期筛选</text>
      <text x="259" y="27" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" fill="#344054">分页结果</text>
      <text x="367" y="27" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" fill="#344054">DataFrame</text>
    </g>
  </g>

  <g transform="translate(64 355)">
    <text font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16" fill="#667085">FTShare 特色因子</text>
    <circle cx="184" cy="-5" r="3" fill="#3563E9"/>
    <text x="200" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16" fill="#667085">字段筛选与分页</text>
    <circle cx="344" cy="-5" r="3" fill="#3563E9"/>
    <text x="360" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16" fill="#667085">Python 3.9+</text>
  </g>
</svg>
